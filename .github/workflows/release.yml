# SPDX-License-Identifier: Apache-2.0
# Release the two suite binaries, `vyges-loom` and `vyges-physical`.
#
# Produces vyges-<binary>-<rust-triple>.tar.gz, the asset `vyges install loom|physical` fetches:
# one binary, which the installer links every engine's name to.
#
# Every engine (and the libraries they share) is built from a sibling checkout AT THE RELEASE TAG,
# so a binary carries exactly the sources released under that tag. release-suite.sh tags this
# repo after every engine, so the tag exists in each sibling when this runs.
#
# Unix-only and native per target, as the engines that link the design database are.
#
# Trigger: push a tag `v*` (publishes a Release), or run manually against `main` to smoke the build
# (workflow_dispatch uploads artifacts only, no Release). A manual run WITH `tag` rebuilds that
# release from the siblings at that tag and replaces its assets — the way to repair a published
# release without moving its tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and re-attach (e.g. v0.1.47); empty = smoke only"
        required: false
      backfill_macos:
        description: "Build ONLY the macOS leg at `tag` and attach it to that existing release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Which legs to build. A tag push or an ordinary dispatch builds every leg; a backfill dispatch
  # (backfill_macos=true, tag=<existing release>) builds ONLY the macOS leg at that tag and attaches
  # it to the release already published. GitHub's hosted macOS capacity is not always there, and a
  # release ships on Linux green without it; the macOS assets follow by backfill:
  #   gh workflow run release.yml -R <repo> -f tag=<tag> -f backfill_macos=true
  # The leg list lives in this job because a job-level `if:` cannot see `matrix`.
  plan:
    name: plan
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
    outputs:
      include: ${{ steps.legs.outputs.include }}
    steps:
      - id: legs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKFILL: ${{ inputs.backfill_macos && 'true' || 'false' }}
          TAG: ${{ inputs.tag }}
          # ⛔ Never ubuntu-latest: that label rolled to 26.04 and v0.1.47's vyges-physical came out
          # needing GLIBC_2.43, which a 24.04 host cannot load. The Ubuntu version is the org
          # variable VYGES_UBUNTU_VERSION, the same for every release (vyges-tools/actions).
          LEGS: >-
            [
              {"bin": "loom", "target": "x86_64-unknown-linux-gnu", "os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}"},
              {"bin": "loom", "target": "aarch64-unknown-linux-gnu", "os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}-arm"},
              {"bin": "loom", "target": "aarch64-apple-darwin", "os": "macos-${{ vars.VYGES_MACOS_VERSION || '15' }}"},
              {"bin": "physical", "target": "x86_64-unknown-linux-gnu", "os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}"},
              {"bin": "physical", "target": "aarch64-unknown-linux-gnu", "os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}-arm"},
              {"bin": "physical", "target": "aarch64-apple-darwin", "os": "macos-${{ vars.VYGES_MACOS_VERSION || '15' }}"}
            ]
        run: |
          set -euo pipefail
          if [ "$BACKFILL" = true ]; then
            [ -n "$TAG" ] || { echo "::error::backfill_macos needs tag=<an existing release>"; exit 1; }
            gh release view "$TAG" >/dev/null \
              || { echo "::error::no release $TAG to backfill: it is published by the tag run first"; exit 1; }
            LEGS=$(jq -c '[.[] | select(.target == "aarch64-apple-darwin")]' <<<"$LEGS")
          fi
          echo "include=$(jq -c . <<<"$LEGS")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.bin }} ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vyges-tools-suite
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # backfill: build the released sources (the tag), not the dispatch branch
          ref: ${{ inputs.backfill_macos && inputs.tag || '' }}
          path: vyges-tools-suite

      - name: Sibling checkouts at the release ref
        working-directory: .
        run: |
          set -eu
          ref="${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'main' }}"
          for r in loom opendb char sta-si extract em-ir power thermal lvs resize vt-swap buffer-insert \
                   hold-fix drc cdc glitch gds-view remap meas ant stt est sdc \
                   lec formal mpl ifp tap pdn ppl pad fin gpl rsz dpl cts grt drt rmp syn psm upf dft \
                   abc-lib slang-lib cut sparselu events geom layout opendb-lib ortools-lib par sta; do
            git clone -q --depth 1 --branch "$ref" "https://github.com/vyges-tools/$r" "vyges-tools-$r"
            echo "vyges-tools-$r @ $ref $(git -C vyges-tools-$r rev-parse --short HEAD)"
          done

      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake boost bison

      # The prebuilt archives the physical engines link (lec, rmp, syn: ABC; mpl: the
      # partitioner's solver; syn: the SystemVerilog frontend), for the checkouts above.
      - name: Prebuilt solver archives (physical)
        if: matrix.bin == 'physical'
        env:
          GH_TOKEN: ${{ github.token }}   # authenticated bundle download (fetch-bundle.sh)
        run: |
          bash ../vyges-tools-abc-lib/scripts/fetch-bundle.sh "$RUNNER_TEMP/abc" >> "$GITHUB_ENV"
          bash ../vyges-tools-ortools-lib/scripts/fetch-bundle.sh "$RUNNER_TEMP/ortools" >> "$GITHUB_ENV"
          bash ../vyges-tools-slang-lib/scripts/fetch-bundle.sh "$RUNNER_TEMP/slang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          [ "${{ runner.os }}" = "macOS" ] && export PATH="$(brew --prefix bison)/bin:$PATH"
          cargo build --release --features ${{ matrix.bin }} --bin vyges-${{ matrix.bin }}

      - name: Smoke (every engine answers --version under its own name)
        run: |
          set -eu
          b="target/release/vyges-${{ matrix.bin }}"
          d="$RUNNER_TEMP/smoke"; mkdir -p "$d"
          for e in $("$b" --suite-engines); do
            ln -sf "$PWD/$b" "$d/vyges-$e"
            "$d/vyges-$e" --version >/dev/null 2>&1 || "$d/vyges-$e" --help >/dev/null 2>&1 \
              || { echo "::error::vyges-$e answers neither --version nor --help"; exit 1; }
          done

      # Runner and glibc floor, one policy for every release: vyges-tools/actions.
      - name: glibc ceiling
        uses: vyges-tools/actions/glibc-ceiling@v1
        with:
          runner: ${{ matrix.os }}
          working-directory: vyges-tools-suite
          paths: target

      - name: Package vyges-${{ matrix.bin }}-${{ matrix.target }}.tar.gz
        id: pkg
        run: |
          set -eu
          NAME="vyges-${{ matrix.bin }}-${{ matrix.target }}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE/notices"
          cp "target/release/vyges-${{ matrix.bin }}" "$STAGE/"
          cp LICENSE NOTICE README.md "$STAGE/"
          for e in $("target/release/vyges-${{ matrix.bin }}" --suite-engines); do
            mkdir -p "$STAGE/notices/$e"
            for f in LICENSE NOTICE THIRD_PARTY_LICENSES.md; do
              [ -f "../vyges-tools-$e/$f" ] && cp "../vyges-tools-$e/$f" "$STAGE/notices/$e/"
            done
          done
          if [ "${{ matrix.bin }}" = physical ]; then
            cp -R "$VYGES_ABC_PREBUILT_DIR/licenses" "$STAGE/notices/licenses-abc" 2>/dev/null || true
            cp "$VYGES_ABC_PREBUILT_DIR/NOTICE" "$STAGE/notices/NOTICE-abc" 2>/dev/null || true
            cp -R "$VYGES_ORTOOLS_PREBUILT_DIR/licenses" "$STAGE/notices/licenses-ortools" 2>/dev/null || true
            cp "$VYGES_ORTOOLS_PREBUILT_DIR/NOTICE" "$STAGE/notices/NOTICE-ortools" 2>/dev/null || true
            cp -R "$VYGES_SLANG_PREBUILT_DIR/licenses" "$STAGE/notices/licenses-slang" 2>/dev/null || true
            cp "$VYGES_SLANG_PREBUILT_DIR/NOTICE" "$STAGE/notices/NOTICE-slang" 2>/dev/null || true
          fi
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/$NAME.tar.gz" "$NAME"
          ( cd "$GITHUB_WORKSPACE" && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach to Release (tags only)
        if: (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && !inputs.backfill_macos
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

      # macOS backfill (backfill_macos=true): attach this leg's assets to the EXISTING release at
      # `tag` with `gh release upload --clobber`. It never creates or edits the release. Where the
      # release carries a SHA256SUMS, its lines for these files are replaced and it is re-uploaded.
      - name: Backfill macOS assets onto the existing release
        if: ${{ inputs.backfill_macos }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE"
          tars=( *-"$TARGET".tar.gz )
          [ ${#tars[@]} -gt 0 ] || { echo "::error::no $TARGET tarball was packaged"; exit 1; }
          files=( "${tars[@]}" *-"$TARGET".tar.gz.sha256 )
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            sums="$RUNNER_TEMP/sums/SHA256SUMS"
            gh release download "$TAG" -p SHA256SUMS -D "$RUNNER_TEMP/sums" --clobber
            for t in "${tars[@]}"; do
              awk -v t="$t" '$2 != t' "$sums" > "$sums.new"; mv "$sums.new" "$sums"
            done
            shasum -a 256 "${tars[@]}" >> "$sums"
            files+=( "$sums" )
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "backfilled $TAG: ${files[*]##*/}"
