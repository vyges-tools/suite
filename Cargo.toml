[package]
name = "vyges-suite"
version = "0.1.45"
edition = "2021"
description = "The Vyges engines as two binaries: vyges-loom (analysis and sign-off) and vyges-physical (physical construction). Each runs the engine it is invoked as."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/suite"
publish = false

[features]
# Each binary's engines, built with their command-line entry (`suite`).
loom = ["dep:vyges-loom", "dep:vyges-opendb", "dep:vyges-char", "dep:vyges-sta-si", "dep:vyges-extract", "dep:vyges-em-ir", "dep:vyges-power", "dep:vyges-thermal", "dep:vyges-lvs", "dep:vyges-resize", "dep:vyges-vt-swap", "dep:vyges-buffer-insert", "dep:vyges-hold-fix", "dep:vyges-drc", "dep:vyges-cdc", "dep:vyges-glitch", "dep:vyges-gds-view", "dep:vyges-remap", "dep:vyges-meas", "dep:vyges-ant", "dep:vyges-stt", "dep:vyges-est"]
physical = ["dep:vyges-lec", "dep:vyges-mpl", "dep:vyges-ifp", "dep:vyges-tap", "dep:vyges-pdn", "dep:vyges-ppl", "dep:vyges-pad", "dep:vyges-fin", "dep:vyges-gpl", "dep:vyges-rsz", "dep:vyges-dpl", "dep:vyges-cts", "dep:vyges-grt", "dep:vyges-drt"]

# Every engine from its sibling checkout (the release CI checks each out at the release tag), so
# a binary is built from exactly the sources released under that tag.
[dependencies]
vyges-loom = { path = "../vyges-tools-loom", optional = true, features = ["suite"] }
vyges-opendb = { path = "../vyges-tools-opendb", optional = true, features = ["suite"] }
vyges-char = { path = "../vyges-tools-char", optional = true, features = ["suite"] }
vyges-sta-si = { path = "../vyges-tools-sta-si", optional = true, features = ["suite"] }
vyges-extract = { path = "../vyges-tools-extract", optional = true, features = ["suite"] }
vyges-em-ir = { path = "../vyges-tools-em-ir", optional = true, features = ["suite"] }
vyges-power = { path = "../vyges-tools-power", optional = true, features = ["suite"] }
vyges-thermal = { path = "../vyges-tools-thermal", optional = true, features = ["suite"] }
vyges-lvs = { path = "../vyges-tools-lvs", optional = true, features = ["suite"] }
vyges-resize = { path = "../vyges-tools-resize", optional = true, features = ["suite"] }
vyges-vt-swap = { path = "../vyges-tools-vt-swap", optional = true, features = ["suite"] }
vyges-buffer-insert = { path = "../vyges-tools-buffer-insert", optional = true, features = ["suite"] }
vyges-hold-fix = { path = "../vyges-tools-hold-fix", optional = true, features = ["suite"] }
vyges-drc = { path = "../vyges-tools-drc", optional = true, features = ["suite"] }
vyges-cdc = { path = "../vyges-tools-cdc", optional = true, features = ["suite"] }
vyges-glitch = { path = "../vyges-tools-glitch", optional = true, features = ["suite"] }
vyges-gds-view = { path = "../vyges-tools-gds-view", optional = true, features = ["suite"] }
vyges-remap = { path = "../vyges-tools-remap", optional = true, features = ["suite"] }
vyges-meas = { path = "../vyges-tools-meas", optional = true, features = ["suite"] }
vyges-ant = { path = "../vyges-tools-ant", optional = true, features = ["suite"] }
vyges-stt = { path = "../vyges-tools-stt", optional = true, features = ["suite"] }
vyges-est = { path = "../vyges-tools-est", optional = true, features = ["suite"] }
vyges-lec = { path = "../vyges-tools-lec", optional = true, features = ["suite", "abc"] }
vyges-mpl = { path = "../vyges-tools-mpl", optional = true, features = ["suite", "par"] }
vyges-ifp = { path = "../vyges-tools-ifp", optional = true, features = ["suite"] }
vyges-tap = { path = "../vyges-tools-tap", optional = true, features = ["suite"] }
vyges-pdn = { path = "../vyges-tools-pdn", optional = true, features = ["suite"] }
vyges-ppl = { path = "../vyges-tools-ppl", optional = true, features = ["suite"] }
vyges-pad = { path = "../vyges-tools-pad", optional = true, features = ["suite"] }
vyges-fin = { path = "../vyges-tools-fin", optional = true, features = ["suite"] }
vyges-gpl = { path = "../vyges-tools-gpl", optional = true, features = ["suite"] }
vyges-rsz = { path = "../vyges-tools-rsz", optional = true, features = ["suite"] }
vyges-dpl = { path = "../vyges-tools-dpl", optional = true, features = ["suite"] }
vyges-cts = { path = "../vyges-tools-cts", optional = true, features = ["suite"] }
vyges-grt = { path = "../vyges-tools-grt", optional = true, features = ["suite"] }
vyges-drt = { path = "../vyges-tools-drt", optional = true, features = ["suite"] }

[lib]
name = "vyges_suite"
path = "src/lib.rs"

[[bin]]
name = "vyges-loom"
path = "src/bin/vyges-loom.rs"
required-features = ["loom"]

[[bin]]
name = "vyges-physical"
path = "src/bin/vyges-physical.rs"
required-features = ["physical"]

[profile.release]
strip = true

# The engines name each other by git URL; every spelling resolves to the same sibling checkout,
# so each crate is built once and linked once.
[patch."https://github.com/vyges-tools/abc-lib"]
vyges-abc-lib = { path = "../vyges-tools-abc-lib" }

[patch."https://github.com/vyges-tools/dpl.git"]
vyges-dpl = { path = "../vyges-tools-dpl" }

[patch."https://github.com/vyges-tools/est.git"]
vyges-est = { path = "../vyges-tools-est" }

[patch."https://github.com/vyges-tools/events"]
vyges-events = { path = "../vyges-tools-events" }

[patch."https://github.com/vyges-tools/events.git"]
vyges-events = { path = "../vyges-tools-events" }

[patch."https://github.com/vyges-tools/gds-view"]
vyges-gds-view = { path = "../vyges-tools-gds-view" }

[patch."https://github.com/vyges-tools/geom"]
vyges-geom = { path = "../vyges-tools-geom" }

[patch."https://github.com/vyges-tools/grt.git"]
vyges-grt = { path = "../vyges-tools-grt" }

[patch."https://github.com/vyges-tools/layout"]
vyges-layout = { path = "../vyges-tools-layout" }

[patch."https://github.com/vyges-tools/loom"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/ortools-lib"]
vyges-ortools-lib = { path = "../vyges-tools-ortools-lib" }

[patch."https://github.com/vyges-tools/par"]
vyges-par = { path = "../vyges-tools-par" }

[patch."https://github.com/vyges-tools/rsz.git"]
vyges-rsz = { path = "../vyges-tools-rsz" }

[patch."https://github.com/vyges-tools/sta-si"]
vyges-sta-si = { path = "../vyges-tools-sta-si" }

[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/stt.git"]
vyges-stt = { path = "../vyges-tools-stt" }

